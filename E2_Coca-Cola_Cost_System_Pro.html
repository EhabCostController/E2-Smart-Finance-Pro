<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2 Coca-Cola Cost System - Invoice Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-app: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --table-header-bg: #0f172a;
            --table-row-alt: #24324a;
            --highlight-bg: #78350f;
            --highlight-text: #fde68a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-app);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .cashier-panel, .receipt-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 1.15rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 3px;
        }

        .input-style {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: bold;
            outline: none;
        }

        .input-style:focus { border-color: var(--primary); }

        .btn-block {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-block:hover { background: #059669; }

        .btn-print {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .btn-print:hover { background: #2563eb; }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0px;
            font-size: 0.95rem;
            text-align: center;
            background: var(--card-bg);
            color: var(--text-main);
        }

        table, th, td {
            border: 1px solid var(--card-border);
        }

        th, td {
            padding: 10px;
            font-weight: bold;
        }

        th {
            background: var(--table-header-bg);
            color: var(--text-main);
            font-size: 1rem;
        }

        tbody tr:nth-child(even) {
            background: var(--table-row-alt);
        }

        .total-row {
            background: var(--table-header-bg);
        }

        .yellow-highlight {
            background: var(--highlight-bg) !important;
            color: var(--highlight-text) !important;
        }

        .delete-btn {
            color: var(--primary);
            cursor: pointer;
            border: none;
            background: none;
        }

        .warning-text {
            color: var(--warning);
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
        }

        @media print {
            body { background: white; color: black; padding: 0; }
            .cashier-panel, .btn-print, .delete-btn, th:last-child, td:last-child { display: none !important; }
            .main-grid { grid-template-columns: 1fr; }
            .receipt-panel { border: none; box-shadow: none; background: white; color: black; padding: 0; }
            table { width: 100% !important; margin: 0; background: white; color: black; }
            table, th, td { border: 2px solid #000000 !important; }
            th { background: #f1f5f9 !important; color: #000 !important; }
            tbody tr:nth-child(even) { background: #f8fafc !important; }
            .total-row { background: #f1f5f9 !important; }
            .yellow-highlight { background: #ffff00 !important; color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class="main-grid">
        <!-- لوحة الإدخال -->
        <div class="cashier-panel">
            <h2><i class="fa-solid fa-calculator" style="color: var(--primary);"></i> إدخال الفاتورة</h2>
            
            <div class="form-group">
                <label>اسم الصنف</label>
                <select id="prodName" class="input-style" onchange="autoSelectPack()">
                    <!-- خيار افتراضي فارغ -->
                    <option value="" data-pack="0" data-price="0.000" selected disabled>-- اختر الصنف من هنا --</option>
                    <option value="كولا كانز" data-pack="24" data-price="279.650">كولا كانز (24 قطعة)</option>
                    <option value="كولا دايت كانز" data-pack="24" data-price="279.650">كولا دايت كانز (24 قطعة)</option>
                    <option value="اسبرايت كانز" data-pack="24" data-price="279.650">اسبرايت كانز (24 قطعة)</option>
                    <option value="فانتا كانز" data-pack="24" data-price="279.650">فانتا كانز (24 قطعة)</option>
                    <option value="صودا" data-pack="12" data-price="231.230">صودا (12 قطعة)</option>
                    <option value="تونيك" data-pack="12" data-price="231.230">تونيك (12 قطعة)</option>
                    <option value="مياة دساني 1.5" data-pack="12" data-price="93.860">مياة دساني 1.5 (12 قطعة)</option>
                    <option value="مياة دساني 600" data-pack="20" data-price="96.490">مياة دساني 600 (20 قطعة)</option>
                    <option value="كولا باجين" data-pack="1" data-price="0.000">كولا باجين (1 قطعة)</option>
                    <option value="اسبرايت باجين" data-pack="1" data-price="0.000">اسبرايت باجين (1 قطعة)</option>
                    <option value="فانتا باجين" data-pack="1" data-price="0.000">فانتا باجين (1 قطعة)</option>
                    <option value="غاز كولا" data-pack="1" data-price="0.000">غاز كولا (1 قطعة)</option>
                </select>
            </div>

            <div class="form-group">
                <label>عدد الوحدات في الكرتونة</label>
                <input type="number" id="packSize" class="input-style" value="0" min="1">
            </div>

            <div class="form-group">
                <label>الكمية المستلمة (الكراتين)</label>
                <input type="number" id="qty" class="input-style" value="0" min="1">
            </div>

            <div class="form-group">
                <label>السعر الأساسي للكرتونة (قبل الخصم والضريبة)</label>
                <input type="number" id="price" class="input-style" value="0" step="0.001">
            </div>

            <div class="form-group" style="border-top: 1px dashed var(--card-border); padding-top: 8px;">
                <label>إجمالي الخصم للصنف بالكامل</label>
                <input type="number" id="totalDiscount" class="input-style" value="0" step="0.001">
            </div>

            <div class="form-group" style="border-top: 1px dashed var(--card-border); padding-top: 8px;">
                <label>إجمالي ضريبة 8%</label>
                <input type="number" id="tax8" class="input-style" value="0" step="0.001">
            </div>

            <div class="form-group">
                <label style="color: #60a5fa;">إجمالي ضريبة 14% للصنف</label>
                <input type="number" id="tax14" class="input-style" value="0" step="0.001" style="border-color: #3b82f6;">
            </div>

            <div id="warningBox" class="warning-text"></div>

            <button class="btn-block" onclick="addItemToReceipt()"><i class="fa-solid fa-plus"></i> إضافة إلى الجدول</button>
        </div>

        <!-- لوحة عرض إذن الاستلام -->
        <div class="receipt-panel">
            <div class="receipt-header">
                <h2><i class="fa-solid fa-file-invoice" style="color: var(--success);"></i> إذن الاستلام المالي الدقيق</h2>
                <button class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الإذن</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40%;">اسم الصنف</th>
                            <th style="width: 15%;">الكمية</th>
                            <th style="width: 20%;">السعر</th>
                            <th style="width: 20%;">الاجمالي</th>
                            <th class="delete-btn" style="width: 5%;">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="receiptBody">
                        <!-- البيانات والحسابات تنزل هنا تلقائياً -->
                    </tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="3"><b>الاجمالي</b></td>
                            <td id="grandNetWithout14" style="font-weight: bold;">0.000</td>
                            <td class="delete-btn"></td>
                        </tr>
                        <tr class="total-row">
                            <td colspan="3"><b>قيمة الـ 14%</b></td>
                            <td id="grandTax14" style="font-weight: bold;">0.000</td>
                            <td class="delete-btn"></td>
                        </tr>
                        <tr class="total-row yellow-highlight">
                            <td colspan="3"><b>الاجمالي في الفاتورة</b></td>
                            <td id="grandNetWith14" style="font-weight: bold;">0.000</td>
                            <td class="delete-btn"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        let receiptItems = [];

        function autoSelectPack() {
            const selectElement = document.getElementById('prodName');
            // إذا لم يتم اختيار صنف حقيقي، لا تفعل شيئاً
            if (selectElement.value === "") return;

            const pack = parseInt(selectElement.options[selectElement.selectedIndex].getAttribute('data-pack'));
            const price = parseFloat(selectElement.options[selectElement.selectedIndex].getAttribute('data-price'));
            
            document.getElementById('packSize').value = pack;
            document.getElementById('price').value = price.toFixed(3);
        }

        function showWarning(msg) {
            const box = document.getElementById('warningBox');
            box.innerText = msg;
            box.style.display = 'block';
        }

        function clearWarning() {
            const box = document.getElementById('warningBox');
            box.innerText = '';
            box.style.display = 'none';
        }

        function floorTo2(value) {
            return Math.floor(value * 100 + 1e-9) / 100;
        }

        function addItemToReceipt() {
            clearWarning();

            const prodName = document.getElementById('prodName').value;
            if (prodName === "") { alert('الرجاء اختيار صنف أولاً'); return; }

            const packSize = parseInt(document.getElementById('packSize').value) || 1;
            const qty = parseFloat(document.getElementById('qty').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            
            const totalDiscount = parseFloat(document.getElementById('totalDiscount').value) || 0;
            const tax8 = parseFloat(document.getElementById('tax8').value) || 0;
            const tax14 = parseFloat(document.getElementById('tax14').value) || 0;

            if (qty <= 0) { alert('الرجاء إدخال كمية صحيحة'); return; }
            if (packSize <= 0) { alert('عدد الوحدات في الكرتونة يجب أن يكون أكبر من صفر'); return; }

            const discountPerCarton = totalDiscount / qty;
            const tax8PerCarton = tax8 / qty;
            const netCartonPrice = price - discountPerCarton + tax8PerCarton;
            const totalNetVal = netCartonPrice * qty;

            if (netCartonPrice < 0) {
                showWarning('تنبيه: الخصم أكبر من سعر الكرتونة، السعر الصافي أصبح سالباً. تأكد من صحة الأرقام.');
            }

            const totalUnits = qty * packSize;
            if (totalUnits <= 0) { alert('لا يمكن حساب عدد الوحدات، تأكد من الكمية وعدد الوحدات بالكرتونة'); return; }

            const rawUnitPrice = totalNetVal / totalUnits;
            const roundedUnitPrice = floorTo2(rawUnitPrice);

            const qtyRow1 = totalUnits - 1;
            const rows = [];

            if (qtyRow1 > 0) {
                const priceRow1 = roundedUnitPrice;
                const totalRow1 = qtyRow1 * priceRow1;
                const totalRow2 = totalNetVal - totalRow1;
                rows.push({ qty: qtyRow1, price: priceRow1, total: totalRow1 });
                rows.push({ qty: 1, price: totalRow2, total: totalRow2 });
            } else {
                rows.push({ qty: totalUnits, price: totalNetVal, total: totalNetVal });
            }

            receiptItems.push({
                name: prodName,
                tax14: tax14,
                totalNetVal: totalNetVal,
                rows: rows
            });

            renderReceipt();
            
            // إعادة تعيين القائمة للافتراضي بعد الإضافة
            document.getElementById('prodName').selectedIndex = 0;
            document.getElementById('packSize').value = 0;
            document.getElementById('price').value = 0;
            document.getElementById('qty').value = 0;
            document.getElementById('totalDiscount').value = 0;
            document.getElementById('tax8').value = "0.000";
            document.getElementById('tax14').value = 0;
        }

        function deleteItem(index) {
            receiptItems.splice(index, 1);
            renderReceipt();
        }

        function renderReceipt() {
            const tbody = document.getElementById('receiptBody');
            tbody.innerHTML = '';
            
            let sumNetWithout14 = 0;
            let sumTax14 = 0;

            receiptItems.forEach((item, index) => {
                sumNetWithout14 += item.totalNetVal;
                sumTax14 += item.tax14;

                item.rows.forEach((row, rowIndex) => {
                    const actionBtn = rowIndex === 0 
                        ? `<button class="delete-btn" onclick="deleteItem(${index})"><i class="fa-solid fa-trash"></i></button>` 
                        : '';

                    const tableRow = `<tr>
                        <td>${item.name}</td>
                        <td>${row.qty.toLocaleString('ar-EG')}</td>
                        <td>${row.price.toLocaleString('ar-EG', { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</td>
                        <td>${row.total.toLocaleString('ar-EG', { minimumFractionDigits: 3, maximumFractionDigits: 3 })}</td>
                        <td class="delete-btn">${actionBtn}</td>
                    </tr>`;
                    tbody.innerHTML += tableRow;
                });
            });

            const sumNetWith14 = sumNetWithout14 + sumTax14;

            document.getElementById('grandNetWithout14').innerText = sumNetWithout14.toLocaleString('ar-EG', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
            document.getElementById('grandTax14').innerText = sumTax14.toLocaleString('ar-EG', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
            document.getElementById('grandNetWith14').innerText = sumNetWith14.toLocaleString('ar-EG', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
        }

        window.onload = function() {
            autoSelectPack();
        };
    </script>
</body>
</html>
